<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>浚鍵管理有限公司 · 西鐵小巴旗艦系統 v5.5 (尊貴黑金版)</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0b0f19 !important;color:#f1f5f9 !important;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:16px}

/* 高級質感頂部導航 */
.header{padding:16px 20px;text-align:center;border-bottom:1px solid rgba(56,189,248,0.15) !important;flex-shrink:0;position:relative;background:linear-gradient(135deg,#131c2e,#0b0f19) !important;box-shadow:0 4px 25px rgba(0,0,0,0.8)}
.header .title{font-size:22px;font-weight:800;color:#38bdf8 !important;letter-spacing:0.5px}
.header .dev{font-size:12px;color:#94a3b8 !important;margin-top:3px}
.voice-btn{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#0284c7) !important;border:none !important;color:#fff !important;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(14,165,233,0.4)}
.voice-btn.muted{background:linear-gradient(135deg,#f43f5e,#e11d48) !important}

.view{display:none;flex:1;overflow-y:auto;padding:16px;background:#0b0f19 !important}
.view.active{display:block}

/* 高級霧面碳黑卡片 */
.card{background:linear-gradient(145deg,#131c2e,#1a263d) !important;border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.07) !important;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.card-title{font-size:15px;font-weight:700;color:#38bdf8 !important;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(56,189,248,0.2) !important}

/* 按鈕全面改為高級流光金屬漸層，徹底告別螢光綠藍 */
.btn{width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:700;border:none !important;cursor:pointer;color:#fff !important;margin-bottom:10px;display:block;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.4);transition:all 0.2s ease}
.btn:active{opacity:.85;transform:scale(0.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 乘客入口：高級深海藍金屬漸層 */
.btn-portal{background:linear-gradient(135deg,#0284c7,#0369a1) !important;border:1px solid rgba(56,189,248,0.3) !important}
/* 司機入口：高級沉穩墨綠金屬漸層 */
.btn-driver{background:linear-gradient(135deg,#059669,#047857) !important;border:1px solid rgba(16,185,129,0.3) !important}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7) !important}
.btn-success{background:linear-gradient(135deg,#10b981,#059669) !important}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#e11d48) !important}
.btn-warn{background:linear-gradient(135deg,#fbbf24,#f59e0b) !important;color:#0b0f19 !important}
.btn-secondary{background:#1e293b !important;color:#94a3b8 !important;border:1px solid rgba(255,255,255,0.08) !important}
.btn-outline{background:transparent !important;border:1px solid rgba(56,189,248,0.3) !important;color:#38bdf8 !important}
.btn-purple{background:linear-gradient(135deg,#a855f7,#9333ea) !important;color:#fff !important}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-block;margin:0 4px 0 0}

.row{display:flex;gap:10px;margin-bottom:10px}
.row>*{flex:1}

input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12) !important;font-size:16px;background:#070a12 !important;color:#f1f5f9 !important;margin-bottom:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#38bdf8 !important;box-shadow:0 0 0 3px rgba(56,189,248,0.2)}
label{display:block;font-size:13px;color:#94a3b8 !important;margin-bottom:6px;font-weight:600}

.big-number{font-size:48px;font-weight:800;text-align:center;color:#34d399 !important;margin:6px 0}
.station-name{font-size:24px;font-weight:700;text-align:center;color:#38bdf8 !important;margin:6px 0}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e293b !important;color:#fff !important;padding:12px 24px;border-radius:12px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;border:1px solid rgba(56,189,248,0.4);pointer-events:none;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.toast.show{opacity:1}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,7,13,0.9);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-card{background:linear-gradient(145deg,#131c2e,#1a263d) !important;border:2px solid #38bdf8 !important;border-radius:24px;padding:24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.9)}
.modal-card h2{color:#38bdf8 !important;margin-bottom:14px;font-size:20px;text-align:center}

.tab-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab-btn{flex:1;min-width:80px;padding:12px 6px;background:#070a12 !important;border:1px solid rgba(255,255,255,0.08) !important;color:#94a3b8 !important;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700}
.tab-btn.active{background:linear-gradient(135deg,#0ea5e9,#0284c7) !important;color:#fff !important;border-color:transparent !important}

.wake-lock-status{position:fixed;bottom:10px;left:10px;font-size:11px;color:#94a3b8;z-index:5;background:rgba(11,15,25,0.9);padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08)}
.connection-status{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:6px 18px;border-radius:20px;font-size:13px;z-index:100;display:none}
.connection-status.online{background:#059669 !important;color:#fff !important;display:block}
.connection-status.offline{background:#e11d48 !important;color:#fff !important;display:block}
</style>
</head>
<body>
<div class="header">
  <div class="title">🚐 浚鍵管理有限公司 · 西鐵小巴系統</div>
  <div class="dev">大棠黃泥墩 ⇄ 元朗市中心快線</div>
  <button class="voice-btn" id="global-voice-btn">🔊</button>
</div>
<div class="connection-status" id="connection-status"></div>

<!-- 登入選擇彈窗 -->
<div class="modal" id="login-modal">
  <div class="modal-card">
    <h2>🔐 系統登入</h2>
    <div id="login-choice">
      <button class="btn btn-primary" id="login-google">🅶 管理員 Google 登入</button>
      <button class="btn btn-driver" id="login-driver">🚏 司機 / 管理員登入</button>
      <button class="btn btn-portal" id="login-passenger">🧍 乘客登入</button>
    </div>
    <div id="driver-login-form" style="display:none">
      <label>司機／管理員電話或電郵</label>
      <input type="text" id="driver-identifier" placeholder="例如：91234567">
      <button class="btn btn-success" id="driver-login-btn">確認登入</button>
      <button class="btn btn-secondary" id="driver-login-back">返回</button>
      <div id="driver-login-error" style="color:#e11d48;font-size:14px;margin-top:8px;text-align:center"></div>
    </div>
    <div id="passenger-login-form" style="display:none">
      <label>電話號碼（8 位數字）</label>
      <input type="tel" id="passenger-phone" placeholder="例如：91234567" maxlength="8" inputmode="numeric">
      <label>您的姓名</label>
      <input type="text" id="passenger-name" placeholder="例如：陳先生" maxlength="20">
      <button class="btn btn-portal" id="passenger-login-btn">確認登入</button>
      <button class="btn btn-secondary" id="passenger-login-back">返回</button>
      <div id="passenger-login-error" style="color:#e11d48;font-size:14px;margin-top:8px;text-align:center"></div>
    </div>
    <button class="btn btn-secondary" id="login-cancel" style="margin-top:10px">取消</button>
  </div>
</div>

<!-- 主大堂首頁 -->
<div id="view-lobby" class="view active">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="card-title" style="margin:0; border:none;">📋 系統使用說明</div>
      <button class="btn btn-outline btn-sm" onclick="speakUsageGuide()">🔊 播放語音說明</button>
    </div>
    <div style="font-size:14px;line-height:1.8;color:#94a3b8;margin-top:10px">
      🚏 <strong>司機端</strong>：登入後設定車牌與認領當值班次，接收全功能彈窗通知與聲音警報。<br>
      🧍 <strong>乘客端</strong>：登入後可查看即時車輛位置、留位、語音輸入及回報「我已上車」。<br>
      🎙️ <strong>對講機</strong>：司機與管理員即時語音及文字通訊。
    </div>
  </div>
  <button class="btn btn-portal" id="btn-passenger">🧍 進入乘客專用端</button>
  <button class="btn btn-driver" id="btn-driver">🚏 進入司機專業端</button>
  <button class="btn btn-warn" id="btn-admin-panel" style="display:none">👑 總管後台</button>
  <button class="btn btn-secondary" id="btn-logout" style="display:none">🚪 登出帳號</button>
  <div class="card" style="text-align:center">
    <div style="font-size:15px;font-weight:700;color:#fbbf24;margin-bottom:6px">☕ 支持開發者</div>
    <div id="fps-code" style="background:#070a12;padding:12px;border-radius:10px;display:inline-block;font-size:16px;color:#fbbf24;cursor:pointer;border:1px solid rgba(251,191,36,0.3)">轉數快 (FPS)：122891914</div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="wake-lock-status" id="wake-lock-status">🔋 屏幕鎖: 未啟用</div>

<script>
console.log('🔵 浚鍵西鐵小巴系統 v5.5 (尊貴黑金版) 載入完畢');
const firebaseConfig = {
  apiKey: "AIzaSyAX7Zy5br1ozGOGxHvDeFNY-Ldcjjw8Qgc",
  authDomain: "triple-login-version.firebaseapp.com",
  databaseURL: "https://triple-login-version-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "triple-login-version",
  storageBucket: "triple-login-version.firebasestorage.app",
  messagingSenderId: "66459706459",
  appId: "1:66459706459:web:28f99a455652f393da0b7e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function speakUsageGuide() {
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance('歡迎使用浚鍵管理有限公司西鐵小巴系統。');
    u.lang = 'zh-HK';
    window.speechSynthesis.speak(u);
  }
}

document.getElementById('btn-passenger').addEventListener('click', () => {
  document.getElementById('login-modal').classList.add('active');
});

document.getElementById('btn-driver').addEventListener('click', () => {
  document.getElementById('login-modal').classList.add('active');
});

document.getElementById('login-cancel').addEventListener('click', () => {
  document.getElementById('login-modal').classList.remove('active');
});

document.getElementById('fps-code').addEventListener('click', () => {
  navigator.clipboard.writeText('122891914').then(() => showToast('✅ 已複製轉數快號碼：122891914'));
});
</script>
</body>
</html>
